<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Triangle Left Ribbon (Cyan to Sky Blue) -->
    <linearGradient id="ribbonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Triangle Right Ribbon (Emerald to Mint) -->
    <linearGradient id="ribbonRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Triangle Top Cap (Electric Blue to Cyan) -->
    <linearGradient id="ribbonTop" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Download Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <radialGradient id="centerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="4" filter="url(#dropShadow)"/>

  <!-- Subtle ambient inner light -->
  <circle cx="256" cy="256" r="180" fill="url(#centerLight)"/>

  <!-- High-Tech Google Drive Delta Shape with Download Fusion -->
  <g filter="url(#dropShadow)">
    <!-- Ambient glow under the emblem -->
    <g opacity="0.35" filter="url(#neonGlow)">
      <!-- Left Leg -->
      <polygon points="256,92 110,344 168,344 256,192" fill="#38bdf8"/>
      <!-- Right Leg -->
      <polygon points="256,92 402,344 344,344 256,192" fill="#10b981"/>
      <!-- Bottom Base Bar -->
      <polygon points="128,370 384,370 354,320 158,320" fill="#0284c7"/>
    </g>

    <!-- Sharp Master Geometry -->
    <!-- Top Apex Cap -->
    <polygon points="256,96 298,168 214,168" fill="url(#ribbonTop)"/>

    <!-- Left Facet Ribbon -->
    <polygon points="256,96 214,168 132,310 178,336 242,224" fill="url(#ribbonLeft)"/>

    <!-- Right Facet Ribbon -->
    <polygon points="256,96 242,224 270,224 380,310 334,336" fill="url(#ribbonRight)"/>

    <!-- Bottom Left Wing Segment -->
    <polygon points="132,310 178,336 210,388 164,362" fill="url(#ribbonLeft)"/>

    <!-- Dynamic High-Velocity Center Download Arrow -->
    <g id="download-arrow">
      <!-- Main downward chevron arrow head -->
      <path d="M256,416 L184,316 L224,316 L224,196 L288,196 L288,316 L328,316 Z" 
            fill="url(#arrowGrad)" 
            stroke="#ffffff" 
            stroke-width="3" 
            stroke-linejoin="round"
            filter="url(#neonGlow)"/>

      <!-- Inner Speed Trail Core -->
      <path d="M256,384 L212,324 L236,324 L236,220 L276,220 L276,324 L300,324 Z" 
            fill="#ffffff" 
            opacity="0.85"/>
      
      <!-- Motion Speed Sparks (Left & Right) -->
      <polygon points="170,392 152,424 160,424 182,392" fill="#38bdf8" opacity="0.8"/>
      <polygon points="144,414 132,434 138,434 152,414" fill="#38bdf8" opacity="0.6"/>
      
      <polygon points="342,392 360,424 352,424 330,392" fill="#10b981" opacity="0.8"/>
      <polygon points="368,414 380,434 374,434 360,414" fill="#10b981" opacity="0.6"/>
    </g>

    <!-- Glass Rim Highlight on Top Edge of Squircle -->
    <path d="M136,30 Q256,22 376,30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
  </g>
</svg>

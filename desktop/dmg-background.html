<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 660px;
      height: 400px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #172033 0%, #0a0e17 75%, #05070c 100%);
      color: #f8fafc;
      position: relative;
      user-select: none;
    }

    /* Subtle background grid pattern */
    .grid-pattern {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* Ambient glow circles */
    .glow-left {
      position: absolute;
      top: 90px;
      left: 100px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(20px);
    }
    .glow-right {
      position: absolute;
      top: 90px;
      right: 100px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(20px);
    }

    /* Header */
    .header {
      position: absolute;
      top: 28px;
      left: 0;
      right: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pro-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 9999px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(99, 102, 241, 0.3));
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }

    .instruction {
      font-size: 13px;
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: -0.01em;
    }

    .instruction strong {
      color: #38bdf8;
      font-weight: 600;
    }

    /* Icon Target Guides */
    /* Center of left target is (180, 170) -> left: 180 - 64 = 116px, top: 170 - 64 = 106px */
    .icon-target-left {
      position: absolute;
      left: 116px;
      top: 106px;
      width: 128px;
      height: 128px;
      border-radius: 26px;
      border: 1.5px dashed rgba(56, 189, 248, 0.25);
      background: rgba(255, 255, 255, 0.02);
      box-shadow: inset 0 0 20px rgba(56, 189, 248, 0.04);
      pointer-events: none;
    }

    /* Center of right target is (480, 170) -> left: 480 - 64 = 416px, top: 170 - 64 = 106px */
    .icon-target-right {
      position: absolute;
      left: 416px;
      top: 106px;
      width: 128px;
      height: 128px;
      border-radius: 26px;
      border: 1.5px dashed rgba(99, 102, 241, 0.25);
      background: rgba(255, 255, 255, 0.02);
      box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.04);
      pointer-events: none;
    }

    /* Center Flow / Arrow */
    .arrow-container {
      position: absolute;
      left: 270px;
      top: 138px;
      width: 120px;
      height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .arrow-svg {
      width: 72px;
      height: 28px;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));
    }

    .arrow-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
    }

    /* Footer Note */
    .footer {
      position: absolute;
      bottom: 22px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 11.5px;
      font-weight: 400;
      color: #475569;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div class="grid-pattern"></div>
  <div class="glow-left"></div>
  <div class="glow-right"></div>

  <div class="header">
    <div class="brand-row">
      <span class="brand-title">DriveMate</span>
      <span class="pro-badge">PRO v1.0.0</span>
    </div>
    <div class="instruction">
      Drag <strong>DriveMate</strong> into <strong>Applications</strong> to install
    </div>
  </div>

  <div class="icon-target-left"></div>

  <div class="arrow-container">
    <svg class="arrow-svg" viewBox="0 0 72 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#38bdf8" />
          <stop offset="100%" stop-color="#818cf8" />
        </linearGradient>
      </defs>
      <path d="M4 14H58M58 14L45 4M58 14L45 24" stroke="url(#arrowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="arrow-label">Drag & Drop</span>
  </div>

  <div class="icon-target-right"></div>

  <div class="footer">
    High-Speed Public Google Drive Downloader • 100% Native Desktop App
  </div>
</body>
</html>

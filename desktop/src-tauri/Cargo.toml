[package]
name = "drivemate-native"
version = "1.0.0"
description = "DriveMate Native — Standalone Google Drive Downloader"
authors = ["DriveMate Team"]
edition = "2021"

[lib]
name = "drivemate_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "DriveMate"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["custom-protocol", "devtools"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "cookies", "rustls-tls", "rustls-tls-webpki-roots", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sha2 = "0.10"
md-5 = "0.10"
tempfile = "3.12"
thiserror = "1.0"
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
open = "5.3"
url = "2.5"
urlencoding = "2.1"
dirs = "5.0"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = true
